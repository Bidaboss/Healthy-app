name: Open Food Facts en direct

# Vérifie, à la demande, que la vraie recherche Open Food Facts répond et que l'app sait la lire.
# Ne fait pas partie de la construction normale, pour qu'elle ne dépende pas du réseau.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/off-live.yml

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Recherche réelle
        env:
          HEALTHY_OFF_LIVE: "true"
        run: ./gradlew :core:test --tests '*OpenFoodFactsLiveTest*'
